  - title: Um Pouco Mais Sobre Mim
    layout: text
    content: | # this will include new lines to allow paragraphs
      <div class="meu-carrossel">
  
      <!-- slide 1 -->
      <div class="meu-slide">
        <img src="images/defesa_tcc.JPG" alt="Apresentação do TCC">
        <div class="legenda">Apresentação dos resultados da pesquisa de TCC para a banca avaliadora na Universidade Federal de Pelotas.</div>
      </div>
      
      <!-- slide 2 -->
      <div class="meu-slide">
        <img src="images/rbras_seagro_2025.JPG" alt="RBras SEAGRO 2025">
        <div class="legenda">Apresentação de trabalho no evento RBras SEAGRO 2025 em Vitória, Espírito Santo.</div>
      </div>

      <!-- slide 3 -->
      <div class="meu-slide">
        <img src="images/desafio_resistencia.JPG" alt="desafio resistência">
        <div class="legenda">Participação no desafio dos 5km no Clube Brilhante em Pelotas, Rio Grande do Sul.</div>
      </div>

      <!-- botões de navegação -->
      <button class="botao-prev" onclick="mudarSlide(-1)">&#10094;</button>
      <button class="botao-next" onclick="mudarSlide(1)">&#10095;</button>
      
      </div>

      <!-- estilo visual -->
      <style>
        .meu-carrossel {
          position: relative;
          max-width: 100%;
          margin: 20px auto;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .meu-slide {
          display: none;
          position: relative;
        }
        .meu-slide img {
          width: 100%;
          display: block;
        }
        /* estilo da legenda preta transparente */
        .legenda {
          position: absolute;
          bottom: 0;
          width: 100%;
          background: rgba(0, 0, 0, 0.75);
          color: #ffffff;
          padding: 12px 15px;
          text-align: center;
          font-size: 15px;
          box-sizing: border-box;
        }
        /* estilo dos botões */
        .botao-prev, .botao-next {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background: rgba(0,0,0,0.5);
          color: white;
          border: none;
          padding: 12px 16px;
          cursor: pointer;
          font-size: 18px;
          border-radius: 4px;
          transition: 0.3s;
        }
        .botao-prev:hover, .botao-next:hover { background: rgba(0,0,0,0.9); }
        .botao-prev { left: 10px; }
        .botao-next { right: 10px; }
        
        /* animação de transição suave */
        .animacao-fade { animation: fade 0.6s ease-in-out; }
        @keyframes fade { from { opacity: 0.5; } to { opacity: 1; } }
      </style>

      <!-- lógica de Funcionamento .js -->
      <script>
        let slideIndex = 1;
        
        // delay
        document.addEventListener("DOMContentLoaded", function() {
          mostrarSlides(slideIndex);
        });

        function mudarSlide(n) {
          mostrarSlides(slideIndex += n);
        }

        function mostrarSlides(n) {
          let i;
          let slides = document.getElementsByClassName("meu-slide");
          if (slides.length === 0) return;
          
          if (n > slides.length) { slideIndex = 1 }
          if (n < 1) { slideIndex = slides.length }
          
          // esconde e remove a animação
          for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
            slides[i].classList.remove("animacao-fade");
          }
          
          // mostra apenas a foto atual e aplica a animação
          slides[slideIndex - 1].style.display = "block";
          slides[slideIndex - 1].classList.add("animacao-fade");
        }
      </script>

