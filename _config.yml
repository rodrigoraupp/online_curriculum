about_title: Sobre Mim
about_profile_image: images/profile.jpeg
about_content: | # this will include new lines to allow paragraphs

  Olá, meu nome é Rodrigo e sou bacharel em Ciência da Computação. 

  Meu forte interesse por Estatística foi o motor que me direcionou para a Ciência de Dados. Atualmente, desenvolvo projetos práticos com o objetivo de expandir meu repertório técnico e exercitar o senso crítico na manipulação e interpretação de dados em diferentes domínios.

  Além da modelagem estatística, busco ter uma visão ponta a ponta dos projetos. Por isso, também dedico meus estudos e práticas às áreas de Análise e Engenharia de Dados, desenvolvendo as habilidades necessárias para construir pipelines modernos, robustos e multifacetados.

