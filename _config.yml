          Ao longo do curso técnico em eletrônica participei do Laboratório 14, grupo de desenvolvimento de projetos e liga robótica. No laboratório, desenvolvi um robô seguidor de linha e sensor de obstáculos, chamado RS Atom, construído com microcontrolador e gravado em linguagem <mark>C</mark>. Com o projeto, conquistei prêmios em competições de robótica.

