        title: Universidade Federal de Pelotas
        caption: 2026
        sub_title: Bacharel em Ciência da Computação
        # quote: >
        #  This is a quote.
        description: | # this will include new lines to allow paragraphs
          Durante a minha graduação em Ciência da Computação, direcionei meu foco para as áreas de Estatística e Aprendizado de Máquina. Na área estatística, aprofundei meus conhecimentos em estatística descritiva, probabilidade e estatística inferencial. 

          Coloquei essa base em prática participando do [Grupo de Assessoramento Técnico em Estatística](https://wp.ufpel.edu.br/clause/assessoramento-tecnico-em-estatistica-aplicada/). Lá, sob a orientação das professoras, prestei consultoria direta a projetos de pesquisadores externos. Essa experiência me permitiu aprender na prática sobre Pesquisa Experimental e consolidar o uso de ferramentas voltadas para análise de dados, como <mark>SAS</mark> e <mark>R</mark>.

          Além disso, expandi meu contato com a Inteligência Artificial por meio do Hub2IA, onde me engajei ativamente em atividades e projetos práticos focados em Aprendizado de Máquina utilizando <mark>Python</mark>.

